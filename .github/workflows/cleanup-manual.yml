name: Cleanup Following (Manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (true = just list, don't unfollow)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cleanup script
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node cleanup-following.js
