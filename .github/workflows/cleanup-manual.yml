name: Cleanup Following

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (true = just list, don't unfollow)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Runs at 09:00 UTC on the 1st of every month.
    # Scheduled runs always actually unfollow (not a dry run) —
    # this is meant to be a recurring cleanup, not just a preview.
    - cron: "0 9 1 * *"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cleanup script
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Manual runs use whatever you pick in the dropdown.
          # Scheduled (cron) runs default to a real cleanup, not a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node cleanup-following.js
