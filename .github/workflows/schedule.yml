name: Bluesky CS2 Auto-Liker/Follower
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      actions_per_run:
        description: "Number of actions per run (likes + follows)"
        required: false
        default: "25"
      search_terms:
        description: "Comma-separated search terms (overrides SEARCH_TERMS secret)"
        required: false
        default: ""
jobs:
  run-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: bluesky-bot
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Debug secrets
        run: |
          echo "HANDLE is set: ${{ secrets.BLUESKY_HANDLE != '' }}"
          echo "PASSWORD is set: ${{ secrets.BLUESKY_PASSWORD != '' }}"

      - name: Sync Bluesky blocks to blocklist.json
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node sync_blocks.js

      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEARCH_TERMS: ${{ github.event.inputs.search_terms || secrets.SEARCH_TERMS }}
          ACTIONS_PER_RUN: ${{ github.event.inputs.actions_per_run || secrets.ACTIONS_PER_RUN || '25' }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: node bot.js

      - name: Commit stats (once per day) and other files (always if changed)
        run: |
          git config user.name "dexterityCS Bot"
          git config user.email "bot@dexteritycs"

          # Always commit data/blocklist.json if it changed
          git add data/blocklist.json
          git diff --staged --quiet data/blocklist.json || git commit -m "🚫 blocklist update — $(date +'%Y-%m-%d %H:%M') UTC"

          # Always commit data/trimmed_terms.json if it changed
          git add data/trimmed_terms.json 2>/dev/null || true
          git diff --staged --quiet data/trimmed_terms.json 2>/dev/null || git commit -m "✂️ trimmed terms update — $(date +'%Y-%m-%d %H:%M') UTC" 2>/dev/null || true

          # Always commit data/candidate_terms.json if it changed
          git add data/candidate_terms.json 2>/dev/null || true
          git diff --staged --quiet data/candidate_terms.json 2>/dev/null || git commit -m "💡 candidate terms update — $(date +'%Y-%m-%d %H:%M') UTC" 2>/dev/null || true

          # Only commit data/stats.json if it hasn't been committed today
          LAST_STATS_COMMIT=$(git log --oneline --format="%ci" -- data/stats.json | head -1 | cut -d' ' -f1)
          TODAY=$(date +'%Y-%m-%d')
          if [ "$LAST_STATS_COMMIT" != "$TODAY" ]; then
            git add data/stats.json
            git diff --staged --quiet data/stats.json || git commit -m "📊 daily stats update — $(date +'%Y-%m-%d') UTC"
          else
            echo "📊 data/stats.json already committed today — skipping (live data in Gist)"
          fi

          git push
