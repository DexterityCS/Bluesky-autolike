name: Bluesky CS2 Auto-Liker/Follower

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Debug secrets
        run: |
          echo "HANDLE is set: ${{ secrets.BLUESKY_HANDLE != '' }}"
          echo "PASSWORD is set: ${{ secrets.BLUESKY_APP_PASSWORD != '' }}"

      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node bot.js

      - name: Commit updated stats
        run: |
          git config user.name "dexterityCS Bot"
          git config user.email "bot@dexteritycs"
          git add stats.json
          git diff --staged --quiet || git commit -m "📊 stats update — $(date +'%Y-%m-%d %H:%M') UTC"
          git push
