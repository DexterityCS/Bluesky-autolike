name: Bluesky CS2 Auto-Liker/Follower

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours
  workflow_dispatch:         # manual trigger from GitHub UI or dashboard

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node bot.js
