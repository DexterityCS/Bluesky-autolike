name: Bluesky CS2 Auto-Liker/Follower

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      actions_per_run:
        description: "Number of actions per run (likes + follows)"
        required: false
        default: "25"
      search_terms:
        description: "Comma-separated search terms (overrides SEARCH_TERMS secret)"
        required: false
        default: ""

jobs:
  run-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: bluesky-bot
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Debug secrets
        run: |
          echo "HANDLE is set: ${{ secrets.BLUESKY_HANDLE != '' }}"
          echo "PASSWORD is set: ${{ secrets.BLUESKY_PASSWORD != '' }}"

      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEARCH_TERMS: ${{ github.event.inputs.search_terms || secrets.SEARCH_TERMS }}
          ACTIONS_PER_RUN: ${{ github.event.inputs.actions_per_run || secrets.ACTIONS_PER_RUN || '25' }}
        run: node bot.js

      - name: Commit updated stats
        run: |
          git config user.name "dexterityCS Bot"
          git config user.email "bot@dexteritycs"
          git add stats.json
          git diff --staged --quiet || git commit -m "📊 stats update — $(date +'%Y-%m-%d %H:%M') UTC"
          git push
