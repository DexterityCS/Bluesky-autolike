name: Monthly Keep-Alive

on:
  schedule:
    - cron: "0 12 1 * *"  # 1st of every month at noon UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update keep-alive timestamp in stats.json
        run: |
          # Read existing stats.json or create default
          if [ -f stats.json ]; then
            TOTAL_LIKES=$(cat stats.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('totalLikes',0))")
            TOTAL_FOLLOWS=$(cat stats.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('totalFollows',0))")
            RUNS=$(cat stats.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runs',0))")
          else
            TOTAL_LIKES=0
            TOTAL_FOLLOWS=0
            RUNS=0
          fi

          # Write updated stats.json with keepalive timestamp
          python3 -c "
import json, datetime
data = {
  'totalLikes': int('$TOTAL_LIKES'),
  'totalFollows': int('$TOTAL_FOLLOWS'),
  'runs': int('$RUNS'),
  'lastRun': open('stats.json').read() and json.load(open('stats.json')).get('lastRun') or None,
  'keepalive': datetime.datetime.utcnow().isoformat() + 'Z'
}
print(json.dumps(data, indent=2))
" > stats.json

      - name: Commit keep-alive
        run: |
          git config user.name "dexterityCS Bot"
          git config user.email "bot@dexteritycs"
          git add stats.json
          git commit -m "💓 keep-alive — $(date +'%B %Y') | $TOTAL_LIKES likes / $TOTAL_FOLLOWS follows total"
          git push
