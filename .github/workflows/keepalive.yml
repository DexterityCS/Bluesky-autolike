name: Monthly Keep-Alive
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Keep-alive commit
        run: |
          git config user.name "dexterityCS Bot"
          git config user.email "bot@dexteritycs"
          git commit --allow-empty -m "💓 keep-alive — $(date +'%B %Y')"
          git push
